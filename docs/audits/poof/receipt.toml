ecked through the declared interaction compiler; no arbitrary unsafe-thunk equivalence is claimed. The safe shared evaluator provides proven memo receipts, cold-slot laziness, cached errors and active-path cycle diagnostics; concurrent instance reads serialize on a mutex. Every finite operational value/error derivation completes at some machine budget from any sound warm cache. Completed results and cycles are stable under increasing budgets; reported cycles prove divergence. Certified instance and mutable reads retain the exact request/snapshot divergence proof. Exhaustion alone remains inconclusive. Actual safe C3 methods now accept parameters and preserve final-self and delayed inherited calls, including argument forwarding. The existing recursive machine shares the complete method name/argument request, reports parameterized cycles with divergence proofs, and distinguishes changing-argument recursion from a repeated request. Dynamic argument equality is computable and kernel justified. Existing value-only object observations are preserved at every depth by the request reindexing theorem. The declared Interaction compiler now executes through the existing unsafe sharedFix/instantiate constructor, records native demand traces, and uses a total safe checker to reconstruct exact-program evaluation proofs and compare reported values/errors. Shared demand executions and safe Evaluates derivations are equivalent; bounded recordings agree at every source depth, and every finite derivation has an admitted trace. A sequential private-cell operational model proves current-body identity, installation before forcing and exactly one constructor start for every ready heap. Checked native C3 field/method reads transfer to existing plan and source graph derivations. These native closures share construction rather than request results. No unchecked unsafe fixed-point equation is assumed. The existing sharedFix now executes one source-owned SharedCell.tie constructor program, also interpreted by a pinned Lean 4.34.0 sequential Ref/Thunk primitive model. Every successful primitive step and trace refines the private-cell protocol. The installed reference remains the result thunk, every ready result has exactly one constructor start, and the self forwarding thunk reads the private Ref at most once. Closure return and completed native publication are separate observations. An optional IO observation adapter records actual closure entries/returns, private Ref pointer readbacks and completed cold/hot gets; safe admission joins those operation data with the current-program result receipt. Valid operation data establishes the declared model derivation, not authentication of IO origin. C++ primitive/reference-counting/compiler/concurrent-memory verification and arbitrary unchecked callbacks remain separate; no opaque IO law is added. Functional checked recursive sessions compose the existing safe shared memo with runtime catalog admission and ordered batches. Every admitted value agrees with completed finite source observations; admitted calls to the same method/argument/program agree in value under different current signatures or registries. Finite-budget diagnostic outcomes can differ between cold and warm memos. No machine cost bound follows from the concrete memo counters. Recursive dispatch adapters reuse actual program-indexed callSlot execution inside retained-state methods; exact packed receipts retain current catalog/input/output admission and source evaluation. Universal success/error/state/ledger laws preserve completed memo states and incomplete-run policy. The integrated example composes C3 final-self billing, guarded two-argument selection, warm re-admission, source recovery, public output refusal, batches, budget/cycle diagnostics and continuation; 240 independent arithmetic/phase/trace/memo-cardinality controls qualify the declared scenario. Method registry/request selection and recovery are explicit callbacks, not automatically inferred policies."},
