Certified instance and mutable reads retain the exact request/snapshot divergence proof. Exhaustion alone remains inconclusive. Actual safe C3 methods now accept parameters and preserve final-self and delayed inherited calls, including argument forwarding. The existing recursive machine shares the complete method name/argument request, reports parameterized cycles with divergence proofs, and distinguishes changing-argument recursion from a repeated request. Dynamic argument equality is computable and kernel justified. Existing value-only object observations are preserved at every depth by the request reindexing theorem. The declared Interaction compiler now executes through the existing unsafe sharedFix/instantiate constructor, records native demand traces, and uses a total safe checker to reconstruct exact-program evaluation proofs and compare reported values/errors. Shared demand executions and safe Evaluates derivations are equivalent; bounded recordings agree at every source depth, and every finite derivation has an admitted trace. A sequential private-cell operational model proves current-body identity, installation before forcing and exactly one constructor start for every ready heap. Checked native C3 field/method reads transfer to existing plan and source graph derivations. These native closures share construction rather than request results. No unchecked unsafe fixed-point equation is assumed. The existing sharedFix now executes one source-owned SharedCell.tie constructor program, also interpreted by a pinned Lean 4.34.0 sequential Ref/Thunk primitive model. Every successful primitive step and trace refines the private-cell protocol. The installed reference remains the result thunk, every ready result has exactly one constructor start, and the self forwarding thunk reads the private Ref at most once. Closure return and completed native publication are separate observations. An optional IO observation adapter records actual closure entries/returns, private Ref pointer readbacks and completed cold/hot gets; safe admission joins those operation data with the current-program result receipt. Valid operation data establishes the declared model derivation, not authentication of IO origin. C++ primitive/reference-counting/compiler/concurrent-memory verification and arbitrary unchecked callbacks remain separate; no opaque IO law is added."},
