  {"id" = "single-inheritance", "start_line" = 633, "status" = "lean_translation", "title" = "Single inheritance", "implementation" = ["LeanPoo/Prototype/Compose.lean", "LeanPoo/Prototype/Object.lean", "LeanPoo/Prototype/CallableRecord.lean", "LeanPoo/Prototype/RecursiveReindex.lean", "LeanPoo/Prototype/DynamicValueEquality.lean", "LeanPoo/Object/Callable.lean"], "checks" = ["Examples/FirstClassObject.lean", "Tests/CallableObjects.lean", "Tests/DynamicValueEquality.lean"], "boundary" = "Typed child-over-parent composition and extension. Actual safe C3 methods now accept parameters and preserve final-self and delayed inherited calls, including argument forwarding. The existing recursive machine shares the complete method name/argument request, reports parameterized cycles with divergence proofs, and distinguishes changing-argument recursion from a repeated request. Dynamic argument equality is computable and kernel justified. Existing value-only object observations are preserved at every depth by the request reindexing theorem."},
  {"id" = "order-case", "start_line" = 674, "status" = "lean_translation", "title" = "Order prototype case", "implementation" = ["LeanPoo/Prototype/Order.lean", "LeanPoo/Prototype/BinaryTreeSemantics.lean"], "checks" = ["Tests/Trees.lean", "Tests/ConstructionSemantics.lean"], "boundary" = "Final-self comparison and string-to-symbol delegation. OrderOps.Laws states totality, equality, strict comparison, transitivity and irreflexivity for replaceable orders. The numeric structural order has those laws and satisfies the exact number/compareMixin source equation. Symbols are typed names."},
  {"id" = "binary-tree-case", "start_line" = 737, "status" = "lean_translation", "title" = "Binary-tree dictionary case", "implementation" = ["LeanPoo/Prototype/BinaryTree.lean", "LeanPoo/Prototype/BinaryTreeSemantics.lean", "LeanPoo/Functional/OrderedDictionary.lean"], "checks" = ["Tests/Trees.lean", "Tests/ConstructionSemantics.lean", "Examples/DictionaryRecords.lean", "Tests/FunctionalOrderedDictionary.lean", "Examples/LayeredRouting.lean", "Examples/KeyedRebalance.lean"], "boundary" = "The structural dictionary satisfies the actual open-recursive source prototype equation, retaining final-self node/acons/ref/afoldr dispatch. Universal insertion ordering, exact overwrite/frame content and lookup laws assume OrderOps.Laws and initially sorted trees. BST insertion is total under a total comparator; folds equal in-order accumulation for every tree and accumulator. Arbitrary replacement node methods must preserve in-order contents. Functional.OrderedDictionary retains explicit comparator, sorted and AVL evidence. Its actual source lookup, ordered acons fold, afoldr and Dictionary.merge agree with complete functional overwrite observations at every key. Supplied pure multi-key proposals preserve the identical snapshot on refusal and publish certified ordered writes on success."},
  {"id" = "avl-case", "start_line" = 800, "status" = "lean_translation", "title" = "AVL override case", "implementation" = ["LeanPoo/Prototype/AVL.lean", "LeanPoo/Prototype/AVLSemantics.lean", "LeanPoo/Prototype/BinaryTreeSemantics.lean", "LeanPoo/Functional/OrderedDictionary.lean"], "checks" = ["Tests/Trees.lean", "Tests/ConstructionSemantics.lean", "Examples/DictionaryRecords.lean", "Tests/FunctionalOrderedDictionary.lean", "Examples/LayeredRouting.lean", "Examples/KeyedRebalance.lean"], "boundary" = "Node-only source extension and exact structural prototype equation. All successful rotations preserve the complete in-order key/value sequence. ValidAVL includes every cached height and balance condition. For arbitrary valid children differing by at most two, avlNode succeeds. Insertion into every valid AVL tree succeeds under a total comparator, preserves validity and grows height by zero or one. OrderOps.Laws adds ordering, lookup overwrite/frame and arbitrary-list construction correspondence. Malformed cached input retains explicit errors. Functional.OrderedDictionary packages the existing source AVL insertion completeness with ordering and all-key overwrite laws into persistent writeMany/merge snapshots; every returned tree retains its sorted, balance and cached-height proofs. Controls independently recompute structure and compare complete reverse-history lookup/export models."},
  {"id" = "numeric", "start_line" = 846, "status" = "lean_translation", "title" = "Numeric functions and number thunks", "implementation" = ["LeanPoo/Prototype/Compose.lean", "LeanPoo/Prototype/Delayed.lean", "LeanPoo/Prototype/CallableRecord.lean", "LeanPoo/Prototype/RecursiveReindex.lean", "LeanPoo/Prototype/DynamicValueEquality.lean", "LeanPoo/Object/Callable.lean"], "checks" = ["Examples/PrototypeFunctions.lean", "Examples/DelayedNumbers.lean", "Tests/PrototypeChecks.lean", "Tests/CallableObjects.lean", "Tests/DynamicValueEquality.lean"], "boundary" = "Both original numeric expected-value checks asserted with typed integer/natural carriers. Actual safe C3 methods now accept parameters and preserve final-self and delayed inherited calls, including argument forwarding. The existing recursive machine shares the complete method name/argument request, reports parameterized cycles with divergence proofs, and distinguishes changing-argument recursion from a repeated request. Dynamic argument equality is computable and kernel justified. Existing value-only object observations are preserved at every depth by the request reindexing theorem."},
  {"id" = "computation-not-value", "start_line" = 883, "status" = "lean_translation", "title" = "Computations rather than values", "implementation" = ["LeanPoo/Prototype/Delayed.lean", "LeanPoo/Prototype/FixedPoint.lean", "LeanPoo/Prototype/Recursive.lean", "LeanPoo/Prototype/RecursiveSemantics.lean", "LeanPoo/Prototype/RecursiveCache.lean", "LeanPoo/Object/RecursiveInstance.lean", "LeanPoo/Object/RecursiveValidation.lean", "LeanPoo/Prototype/RecursiveCacheSemantics.lean", "LeanPoo/Prototype/CallableRecord.lean", "LeanPoo/Prototype/RecursiveReindex.lean", "LeanPoo/Prototype/DynamicValueEquality.lean", "LeanPoo/Object/Callable.lean", "LeanPoo/Functional/Assembly.lean", "LeanPoo/Functional/Requirements.lean", "LeanPoo/Functional/CertifiedRequirements.lean", "LeanPoo/Functional/Access.lean", "LeanPoo/Functional/View.lean"], "checks" = ["Examples/DelayedNumbers.lean", "Tests/RecursiveSemantics.lean", "Tests/RecursiveCache.lean", "Tests/RecursiveValidation.lean", "Tests/RecursiveCacheSemantics.lean", "Tests/CallableObjects.lean", "Tests/DynamicValueEquality.lean", "Tests/FunctionalRequirements.lean", "Tests/FunctionalCertifiedRequirements.lean", "Examples/FunctionalPipeline.lean", "Examples/ValidationWorkflow.lean", "Examples/PreparedViews.lean", "Tests/FunctionalAccess.lean", "Tests/FunctionalView.lean"], "boundary" = "Function requests and unit-input delayed values use the safe Interaction semantics with explicit final self, inherited evaluation, errors and pending observations. Original delayed thunks are also retained as a runtime option. Every finite operational value/error derivation completes at some machine budget from any sound warm cache. Completed results and cycles are stable under increasing budgets; reported cycles prove divergence. Certified instance and mutable reads retain the exact request/snapshot divergence proof. Exhaustion alone remains inconclusive. Actual safe C3 methods now accept parameters and preserve final-self and delayed inherited calls, including argument forwarding. The existing recursive machine shares the complete method name/argument request, reports parameterized cycles with divergence proofs, and distinguishes changing-argument recursion from a repeated request. Dynamic argument equality is computable and kernel justified. Existing value-only object observations are preserved at every depth by the request reindexing theorem. Functional providers retain context-indexed factories and explicitly prepare heterogeneous provided/required capability contracts. Joint result proofs admit consumer constraints; availability does not infer arbitrary callback termination. Context-preserving factory map/bind and child-first provider composition have kernel composition laws. prepareWith builds an ordinary consumer from the exact selected tuple and preserves the original first missing key; these are local convenience APIs for this construction. Factory choose/sequence/fold/recover preserve dependent context indices, selected branches, ordered aggregation and complete success/handler error outcomes. Named access and narrow consumer projection retain exact selected factories and can prepare independently of unrequested missing capabilities. These local consumer APIs are demonstrated by bounded validation and shared prepared views."},
  {"id" = "without-subtyping", "start_line" = 918, "status" = "lean_translation", "title" = "Use without subtyping", "implementation" = ["LeanPoo/Prototype/Compose.lean", "LeanPoo/Prototype/Delayed.lean", "LeanPoo/Functional/OrderedDictionary.lean", "LeanPoo/Functional/MetadataFamily.lean", "LeanPoo/Functional/EnumeratedRequirements.lean"], "checks" = ["Examples/PrototypeCore.lean", "Tests/FunctionalOrderedDictionary.lean", "Examples/LayeredRouting.lean", "Examples/KeyedRebalance.lean", "Tests/FunctionalReflectiveRequirements.lean", "Examples/MetadataDeployment.lean", "Examples/IntrospectiveExport.lean"], "boundary" = "Explicit Lean intermediate types replace paper subtyping notation. Homogeneous context-indexed factories stored in certified source AVL dictionaries compose ordered base/regional/emergency overrides with existing requirement preparation. A complete prepared tuple or first missing key agrees with functional overwrites; preparation selects functions without invoking them. Joint bounds are supplied explicitly and retained through exact-context dependency caching. Checked metadata programs also supply heterogeneous context-indexed factories through explicit final-self application. Successful runtime key-list preparation retains an exact Selected witness; built records expose only declared keys and retain each factory source. Concrete carriers and joint scheduling bounds are supplied explicitly."},
  {"id" = "introspection", "start_line" = 943, "status" = "lean_translation", "title" = "Slot introspection", "implementation" = ["LeanPoo/Object/Memo.lean", "LeanPoo/Object/Schema.lean", "LeanPoo/Prototype/DynamicDescriptor.lean", "LeanPoo/Prototype/DynamicDescriptorSemantics.lean", "LeanPoo/Prototype/DynamicCodec.lean", "LeanPoo/Prototype/DynamicSchema.lean", "LeanPoo/Object/RecursiveValidation.lean", "LeanPoo/Prototype/DynamicDescriptorCompleteness.lean", "LeanPoo/Prototype/DynamicCodecSemantics.lean", "LeanPoo/Prototype/CallableRecord.lean", "LeanPoo/Prototype/RecursiveReindex.lean", "LeanPoo/Prototype/DynamicValueEquality.lean", "LeanPoo/Object/Callable.lean", "LeanPoo/Functional/RecordEvolution.lean"], "checks" = ["Tests/IntegratedPrototype.lean", "Tests/DynamicDescriptor.lean", "Tests/DynamicSchema.lean", "Tests/RecursiveValidation.lean", "Tests/DynamicDescriptorCompleteness.lean", "Tests/DynamicCodecSemantics.lean", "Tests/CallableObjects.lean", "Tests/DynamicValueEquality.lean", "Tests/FunctionalRecordEvolution.lean", "Examples/ConfigurationUpgrade.lean", "Examples/AtomicConfiguration.lean"], "boundary" = "Finite declared keys and enumeration; not arbitrary dynamic Scheme message discovery. Every finite Accepted derivation is recognized at every sufficiently large depth. A union succeeds if either branch succeeds, including an unresolved alternative; diagnostics persist if neither succeeds. Structural JSON has a universal kernel inverse at the computable Value.wireDepth, preserving the same descriptor admission proof and fixed registry. General text-parser/UTF-8 inversion and cost bounds remain separate. Actual safe C3 methods now accept parameters and preserve final-self and delayed inherited calls, including argument forwarding. The existing recursive machine shares the complete method name/argument request, reports parameterized cycles with divergence proofs, and distinguishes changing-argument recursion from a repeated request. Dynamic argument equality is computable and kernel justified. Existing value-only object observations are preserved at every depth by the request reindexing theorem. Runtime record evolution composes existing schema catalogs, ordered field transfer and pure patch groups. Successful recognition preserves the complete source value; generated construction, setters and patches retain exact current-catalog admission. Explicit migration recognizes the source before projection and target defaults/refinements; CheckedRecord retains the actual resolved descriptor membership. Staged batches retain completed groups and the refusing group input, while an explicit atomic publication policy restores the initial value on any refusal and equals the staged result on success. First-error, projection provenance, field membership and admission invariants are kernel laws. Mapping/default policy is caller-supplied; automatic migration inference, arbitrary callback effects and external-effect/concurrent rollback are outside this construction."},
  {"id" = "representations", "start_line" = 980, "status" = "lean_translation", "title" = "Alternative instance/prototype representations", "implementation" = ["LeanPoo/Object/Indexed.lean", "LeanPoo/Object/Prepare.lean", "LeanPoo/Prototype/Record.lean", "LeanPoo/Prototype/DictionaryRecord.lean", "LeanPoo/Prototype/KeyedPrototype.lean", "LeanPoo/Prototype/RecordRepresentations.lean", "LeanPoo/Prototype/BinaryTreeSemantics.lean", "LeanPoo/Functional/EnumeratedRequirements.lean"], "checks" = ["Tests/ObjectDefinition.lean", "Tests/DictionaryRecord.lean", "Tests/Representations.lean", "Tests/ConstructionSemantics.lean", "Examples/DictionaryRecords.lean", "Tests/FunctionalReflectiveRequirements.lean", "Examples/IntrospectiveExport.lean"], "boundary" = "Universal observational simulation connects function records and certified AVL dictionary records for arbitrary corresponding delayed slot bodies and composed layers. It retains related final-self and lazy inherited observations, missing slots, user errors and every untouched key; dictionary parents must be valid and sorted under OrderOps.Laws. DictionaryRecord.fromOrder uses the structural source solution. Key-list projection, child-before-parent lists including duplicates, metadata exposure and both override policies are kernel laws. The relation is on the concrete typed carriers. EnumeratedRequirements reads the final keys slot before preparing heterogeneous factories. Exact erased tuples and first missing errors agree with that declared source list; repeated declarations stay ordered. Constructed records exclude undeclared slots and retain factory provenance. Generated schema arrays retain duplicate declarations, while JSON object inspection follows the existing field-name representation."},
