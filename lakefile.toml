name = "LeanPoo"
version = "0.1.1"
defaultTargets = ["LeanPoo"]
weakLeanArgs = ["-j2", "-M2048"]

[[lean_lib]]
name = "LeanPoo"

[[lean_lib]]
name = "Examples"
roots = ["Examples.Support.GeneralizedFork", "Examples.Support.ComponentRounds", "Examples.Support.JointTopology", "Examples.Support.JointReceipts", "Examples.Support.RecursiveTopology", "Examples.Support.RecursiveApprovals"]

[[lean_exe]]
name = "indexedRegistryScale"
root = "Benchmarks.IndexedRegistryScale"

[[lean_exe]]
name = "scopedTransactionScale"
root = "Benchmarks.ScopedTransactionScale"

[[lean_exe]]
name = "keyIndexScale"
root = "Benchmarks.KeyIndexScale"

[[lean_exe]]
name = "cachedPreparationScale"
root = "Benchmarks.CachedPreparationScale"

[[lean_exe]]
name = "contextSlotScale"
root = "Benchmarks.ContextSlotScale"

[[lean_exe]]
name = "resultIndexScale"
root = "Benchmarks.ResultIndexScale"

[[lean_exe]]
name = "cyclicClosureScale"
root = "Benchmarks.CyclicClosureScale"

[[lean_exe]]
name = "closureLayoutScale"
root = "Benchmarks.ClosureLayoutScale"

[[lean_exe]]
name = "hybridClosureScale"
root = "Benchmarks.HybridClosureScale"
