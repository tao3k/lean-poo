name: Lean CI

on:
  push:
    branches: [main, feat/lean-native-poo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - uses: taiki-e/install-action@just
      - name: Install project shell and Org parser
        run: sudo apt-get update && sudo apt-get install -y zsh emacs-nox
      - name: Check Lean modules, examples, debug, and Org docs
        run: just check
